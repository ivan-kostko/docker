version: 2
updates:
  # Workflow actions are pinned to full commit SHAs with a `# vX.Y.Z` comment.
  # Dependabot updates the SHA and the comment together, so pinning does not
  # stop updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Hook revisions in .pre-commit-config.yaml (the CI policy job runs them).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
