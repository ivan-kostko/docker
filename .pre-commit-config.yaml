---
# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
# CI runs exactly `pre-commit run --all-files` (the "policy" job in
# .github/workflows/ci.yml), so local installation is optional, not a control.
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # .devcontainer/*/devcontainer.json is JSONC (comments), so check-json
      # is deliberately not enabled.

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        # Dockerfile.dockerignore is BuildKit's per-Dockerfile ignore file,
        # not a Dockerfile, but its name matches hadolint's file type.
        exclude: \.dockerignore$
        # Same threshold as CI: only hard errors fail.
        args: [--failure-threshold, error]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -d, "{extends: relaxed, rules: {line-length: disable}}"]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      # Schema validation, complementary to actionlint.
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Findings that are reviewed false positives (e.g. checksums) are
        # marked inline with `pragma: allowlist secret`.

  - repo: local
    hooks:
      - id: devcontainer-policy
        name: devcontainer trust-boundary policy
        description: Fails on unreviewed mounts / risky runtime options in devcontainer.json.
        entry: scripts/check-devcontainer-policy.py
        language: python
        pass_filenames: false
        # Always run: the allowlist and the configs must be checked together.
        always_run: true
